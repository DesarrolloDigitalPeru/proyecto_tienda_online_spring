name: Java CI with Maven

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    # S4 - 1: INSTALAR DOCKER COMPOSE
    - name: Instalar Docker Compose
      run: |
          echo "========================================="
          echo "INSTALANDO DOCKER-COMPOSE"
          echo "========================================="
          sudo apt-get update
          sudo apt-get install -y docker-compose
          docker-compose --version
          echo "✅ Docker Compose instalado correctamente"
          echo "========================================="

    # PASOS DE COMPILACIÓN Y EMPAQUETADO
    - name: Compilar con Maven
      run: mvn clean compile

    - name: Verificar compilación
      run: |
          if [ -d "target" ]; then
            echo "✅ Compilación exitosa - Directorio target creado"
            ls -la target/
          else
            echo "❌ Error: No se creó el directorio target"
            exit 1
          fi

    - name: Empaquetar con Maven
      run: mvn clean package
      continue-on-error: true

    - name: Subir artefacto
      uses: actions/upload-artifact@v4
      with:
        name: app-build
        path: target/*.jar
      continue-on-error: true

    # ANÁLISIS DE CALIDAD
    - name: Analizar con SonarCloud
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
          echo "=== ANALIZANDO CON SONARCLOUD ==="
          echo "Repositorio: proyecto_tienda_online_spring"
          echo "Evento: ${{ github.event_name }}"
          
          if [ -z "$SONAR_TOKEN" ]; then
            echo "ERROR: SONAR_TOKEN no está configurado"
            exit 1
          fi
          mvn verify sonar:sonar \
            -Dsonar.projectKey=DesarrolloDigitalPeru_proyecto_tienda_online_spring \
            -Dsonar.organization=desarrollodigitalperu \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

    # S4 - 2: VALIDACIONES DE DOCKER 
    - name: Validar Dockerfile
      run: |
          echo "========================================="
          echo "PUNTO 1: VALIDAR DOCKERFILE"
          echo "========================================="
          
          if [ -f "Dockerfile" ]; then
            echo "✅ Dockerfile encontrado"
          else
            echo "❌ Dockerfile no encontrado - Creando archivo Dockerfile"
            echo "FROM eclipse-temurin:21-jre-alpine" > Dockerfile
            echo "COPY target/*.jar app.jar" >> Dockerfile
            echo "EXPOSE 8080" >> Dockerfile
            echo "ENTRYPOINT [\"java\", \"-jar\", \"app.jar\"]" >> Dockerfile
            echo "✅ Dockerfile creado automáticamente"
          fi
          
          echo "Verificando sintaxis del Dockerfile..."
          docker build -t test-validate --no-cache --quiet . || exit 1
          echo "✅ Sintaxis del Dockerfile válida"
          echo "========================================="

    - name: Construir imagen Docker
      run: |
          echo "========================================="
          echo "CONSTRUYENDO IMAGEN DOCKER"
          echo "========================================="
          
          docker build -t proyecto-tienda:${{ github.sha }} .
          docker build -t proyecto-tienda:latest .
          
          echo "Imágenes creadas:"
          docker images | grep proyecto-tienda
          echo "✅ Imagen Docker construida exitosamente"
          echo "========================================="
    
    # =========================================
    # PUNTO 2: VALIDAR DOCKER-COMPOSE (CORREGIDO CON SOLUCIÓN 3)
    # =========================================
    - name: Validar docker-compose.yml
      run: |
          echo "========================================="
          echo "PUNTO 2: VALIDAR DOCKER-COMPOSE"
          echo "========================================="
          
          # Verificar que docker-compose.yml existe
          if [ -f "docker-compose.yml" ]; then
            echo "✅ docker-compose.yml encontrado"
          else
            echo "❌ docker-compose.yml no encontrado"
            exit 1
          fi
          
          # DETECCIÓN AUTOMÁTICA DE COMANDO DISPONIBLE
          echo "Verificando comando disponible..."
          if command -v docker-compose &> /dev/null; then
            COMPOSE_CMD="docker-compose"
            echo "✅ Usando: docker-compose (tradicional)"
            $COMPOSE_CMD --version
          elif docker compose version &> /dev/null; then
            COMPOSE_CMD="docker compose"
            echo "✅ Usando: docker compose (plugin)"
            $COMPOSE_CMD version
          else
            echo "❌ ERROR: No se encontró ningún comando de Docker Compose"
            exit 1
          fi
          
          # Validar sintaxis
          echo -e "\nValidando sintaxis..."
          $COMPOSE_CMD config || {
            echo "❌ Error en sintaxis de docker-compose.yml"
            exit 1
          }
          echo "✅ Sintaxis válida"
          
          # Verificar servicios definidos
          echo -e "\nServicios definidos:"
          $COMPOSE_CMD config --services
          
          # Validar servicios críticos
          echo -e "\nValidando servicios críticos..."
          if $COMPOSE_CMD config --services | grep -q "mysql"; then
            echo "✅ Servicio 'mysql' encontrado"
          else
            echo "⚠️ Servicio 'mysql' no encontrado"
          fi
          
          if $COMPOSE_CMD config --services | grep -q "app"; then
            echo "✅ Servicio 'app' encontrado"
          else
            echo "⚠️ Servicio 'app' no encontrado"
          fi
          
          echo "========================================="

    # S4 - 3: VALIDAR VARIABLES DE ENTORNO
    - name: Validar variables de entorno
      run: |
          echo "========================================="
          echo "PUNTO 3: VALIDAR VARIABLES DE ENTORNO"
          echo "========================================="
          
          if [ -f ".env.example" ]; then
            echo "✅ .env.example encontrado"
          else
            echo "❌ .env.example no encontrado"
            exit 1
          fi
          
          echo "Configuración esperada:"
          echo "  Base de datos: tiendaplazachina"
          echo "  Usuario: root"
          echo "  Password: (vacío)"
          
          if grep -q "tiendaplazachina" .env.example; then
            echo "✅ Nombre BD correcto en .env.example"
          else
            echo "❌ Nombre BD incorrecto en .env.example"
          fi
          echo "========================================="
    
    # S4 - 4: CONSTRUIR IMÁGENES DE LA APLICACIÓN
    - name: Construir imágenes Docker (Punto 4)
      run: |
          echo "========================================="
          echo "PUNTO 4: CONSTRUIR IMÁGENES DE LA APLICACIÓN"
          echo "========================================="
          
          # Fecha para tags
          DATE_TAG=$(date +%Y%m%d)
          VERSION="1.0.0"
          
          # Construir imagen con múltiples tags
          echo "1. Construyendo imagen con múltiples tags..."
          docker build -t proyecto-tienda:${{ github.sha }} \
                       -t proyecto-tienda:latest \
                       -t proyecto-tienda:${DATE_TAG} \
                       -t proyecto-tienda:${VERSION} \
                       .
          
          # Listar imágenes creadas
          echo -e "\n2. Imágenes creadas:"
          docker images | grep proyecto-tienda
          
          # Verificar tamaño de imagen
          echo -e "\n3. Verificando tamaño de imagen..."
          SIZE=$(docker inspect proyecto-tienda:latest | grep -m1 "Size" | cut -d ':' -f2 | tr -d ' ,')
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Tamaño de imagen: ${SIZE_MB}MB"
          
          if [ $SIZE_MB -gt 500 ]; then
            echo "⚠️ Advertencia: La imagen es grande (>500MB)"
          else
            echo "✅ Tamaño de imagen óptimo"
          fi
          
          # Guardar imagen como artefacto
          echo -e "\n4. Guardando imagen como artefacto..."
          docker save proyecto-tienda:latest | gzip > proyecto-tienda-${DATE_TAG}.tar.gz
          echo "✅ Imagen guardada: proyecto-tienda-${DATE_TAG}.tar.gz"
          
          echo "========================================="
          
    - name: Subir imagen Docker como artefacto
      uses: actions/upload-artifact@v4
      with:
          name: docker-image
          path: proyecto-tienda-*.tar.gz
          retention-days: 30
    
    # S4 - 5: VALIDAR DESPLIEGUE
    - name: Validar script de despliegue
      if: github.ref == 'refs/heads/main'
      run: |
          echo "========================================="
          echo "PUNTO 5: VALIDAR DESPLIEGUE"
          echo "========================================="
          
          # Verificar que existen los scripts de despliegue
          if [ -f "scripts/deploy.sh" ]; then
            echo "✅ scripts/deploy.sh encontrado"
            chmod +x scripts/deploy.sh
          else
            echo "❌ scripts/deploy.sh no encontrado"
            exit 1
          fi
          
          if [ -f "scripts/verify-deploy.sh" ]; then
            echo "✅ scripts/verify-deploy.sh encontrado"
            chmod +x scripts/verify-deploy.sh
          else
            echo "❌ scripts/verify-deploy.sh no encontrado"
            exit 1
          fi
          
          # Verificar sintaxis de los scripts
          echo "Verificando sintaxis de scripts..."
          bash -n scripts/deploy.sh || exit 1
          bash -n scripts/verify-deploy.sh || exit 1
          echo "✅ Sintaxis de scripts válida"
          
          echo "========================================="

    # S4 - 6: VALIDAR PUERTOS Y SERVICIOS
    - name: Validar configuración de puertos
      run: |
          echo "========================================="
          echo "PUNTO 6: VALIDAR PUERTOS Y SERVICIOS"
          echo "========================================="
          
          # Verificar scripts
          if [ -f "scripts/validate-ports.sh" ]; then
            echo "✅ validate-ports.sh encontrado"
            chmod +x scripts/validate-ports.sh
          else
            echo "❌ validate-ports.sh no encontrado"
            exit 1
          fi
          
          # Verificar configuración en docker-compose.yml
          echo "Verificando mapeo de puertos en docker-compose.yml..."
          
          # App: 8081:8080
          if grep -q "8081:8080" docker-compose.yml; then
            echo "✅ Puerto app: 8081 → 8080"
          else
            echo "❌ Puerto app incorrecto"
          fi
          
          # MySQL: 3307:3306
          if grep -q "3307:3306" docker-compose.yml; then
            echo "✅ Puerto mysql: 3307 → 3306"
          else
            echo "❌ Puerto mysql incorrecto"
          fi
          
          # phpMyAdmin: 8082:80
          if grep -q "8082:80" docker-compose.yml; then
            echo "✅ Puerto phpmyadmin: 8082 → 80"
          else
            echo "❌ Puerto phpmyadmin incorrecto"
          fi
          
          # Verificar red
          if grep -q "networks:" docker-compose.yml; then
            echo "✅ Red configurada"
          else
            echo "❌ Red no configurada"
          fi
          
          # Verificar depends_on
          if grep -q "depends_on:" docker-compose.yml; then
            echo "✅ Dependencias configuradas"
          else
            echo "❌ Dependencias no configuradas"
          fi
          
          echo "========================================="

    # S4 - 7: VALIDAR EJECUCIÓN DEL SISTEMA
    - name: Validar scripts de sistema
      run: |
          echo "========================================="
          echo "PUNTO 7: VALIDAR EJECUCIÓN DEL SISTEMA"
          echo "========================================="
          
          # Verificar que existen los scripts
          SCRIPTS=("validate-system.sh" "health-check.sh" "status-report.sh")
          
          for script in "${SCRIPTS[@]}"; do
            if [ -f "scripts/$script" ]; then
              echo "✅ scripts/$script encontrado"
              chmod +x "scripts/$script"
            else
              echo "❌ scripts/$script no encontrado"
              exit 1
            fi
          done
          
          # Verificar sintaxis de los scripts
          echo "Verificando sintaxis de scripts..."
          for script in "${SCRIPTS[@]}"; do
            bash -n "scripts/$script" || exit 1
            echo "  ✅ $script sintaxis válida"
          done
          
          echo "========================================="

    # S4 - 8: VALIDAR DOCUMENTACIÓN
    - name: Validar documentación de despliegue
      run: |
          echo "========================================="
          echo "PUNTO 8: VALIDAR DOCUMENTACIÓN"
          echo "========================================="
          
          # Verificar archivos de documentación
          DOC_FILES=("DEPLOYMENT.md" "README.md" "CHANGELOG.md" "API.md")
          
          echo "Verificando archivos de documentación:"
          for file in "${DOC_FILES[@]}"; do
            if [ -f "$file" ]; then
              SIZE=$(wc -l < "$file")
              echo "  ✅ $file ($(wc -l < "$file") líneas)"
            else
              echo "  ❌ $file no encontrado"
              exit 1
            fi
          done
          
          # Verificar contenido mínimo en DEPLOYMENT.md
          echo -e "\nVerificando secciones en DEPLOYMENT.md:"
          SECTIONS=("Requisitos" "Despliegue" "Verificación" "Solución de Problemas")
          
          for section in "${SECTIONS[@]}"; do
            if grep -q "$section" DEPLOYMENT.md; then
              echo "  ✅ Sección '$section' encontrada"
            else
              echo "  ❌ Sección '$section' no encontrada"
            fi
          done
          
          echo -e "\n✅ Documentación validada correctamente"
          echo "========================================="

    # S4 - 9: VALIDAR PREPARACIÓN DE VERSIÓN FINAL
    - name: Validar scripts de release
      run: |
          echo "========================================="
          echo "PUNTO 9: VALIDAR SCRIPTS DE RELEASE"
          echo "========================================="
          
          # Verificar scripts de release
          RELEASE_SCRIPTS=("release-version.sh" "verify-release.sh" "release-notes.sh")
          
          for script in "${RELEASE_SCRIPTS[@]}"; do
            if [ -f "scripts/$script" ]; then
              echo "✅ scripts/$script encontrado"
              chmod +x "scripts/$script"
            else
              echo "❌ scripts/$script no encontrado"
              exit 1
            fi
          done
          
          # Verificar sintaxis
          echo "Verificando sintaxis de scripts..."
          for script in "${RELEASE_SCRIPTS[@]}"; do
            bash -n "scripts/$script" || exit 1
            echo "  ✅ $script sintaxis válida"
          done
          
          echo "========================================="

    # EMPAQUETAR Y SUBIR
    - name: Empaquetar aplicación
      run: mvn package -DskipTests
      
    - name: Subir artefacto (JAR generado)
      uses: actions/upload-artifact@v4
      with:
          name: proyecto-tienda-jar
          path: target/*.jar
          retention-days: 30