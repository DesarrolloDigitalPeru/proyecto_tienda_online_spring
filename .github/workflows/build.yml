name: Java CI with Maven

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar JDK 21 # Cambia a 11 o 21 si usas otra versión
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Compilar con Maven
      run: mvn clean compile #run: mvn -B package --file pom.xml
    # Paso adicional: Verificar que la compilación fue exitosa
    - name: Verificar compilación
      run: |
          if [ -d "target" ]; then
            echo "✅ Compilación exitosa - Directorio target creado"
            ls -la target/
          else
            echo "❌ Error: No se creó el directorio target"
            exit 1
          fi
    # 📌 PUNTO 3: Ejecutar pruebas automáticas
    - name: Ejecutar pruebas con Maven
      run: mvn test 
    # Paso adicional: Publicar resultados de pruebas (opcional pero útil)
    - name: Publicar resultados de pruebas
      if: always()  # Se ejecuta incluso si las pruebas fallan
      uses: actions/upload-artifact@v4
      with:
          name: test-results
          path: target/surefire-reports/
      # Paso adicional: Verificar que las pruebas pasaron
    - name: Verificar pruebas
      run: |
          if [ -d "target/surefire-reports" ]; then
            echo "✅ Pruebas ejecutadas - Reportes generados"
            echo "📊 Resumen de pruebas:"
            find target/surefire-reports -name "*.txt" -exec cat {} \; || true
          else
            echo "⚠️ No se encontraron reportes de pruebas"
          fi
